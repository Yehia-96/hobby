<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duel Preview</title>
  <link rel="stylesheet" href="src/hud.css">
  <style>
    #view { position: fixed; inset: 0; }
    #toggles {
      position: fixed; top: 84px; left: 12px; z-index: 11; display: flex; flex-direction: column; gap: 4px;
      background: var(--panel); padding: 8px 12px; border-radius: 10px; font-size: 13px;
    }
    #toggles strong { color: var(--muted); font-weight: 600; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="hud"></div>
  <div id="toggles"><strong>Simulate card in view</strong></div>
  <script type="module" src="src/preview.js"></script>
</body>
</html>
