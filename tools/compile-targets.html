<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compile Card Targets</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #15122a; color: #f2eefc; padding: 24px; max-width: 720px; margin: auto; }
    .cards { display: flex; gap: 16px; margin: 16px 0; }
    .cards figure { margin: 0; text-align: center; font-size: 13px; }
    .cards img { width: 160px; border-radius: 6px; display: block; }
    button { font-size: 16px; padding: 10px 20px; border-radius: 10px; border: 0; background: #8f6bff; color: white; }
    #status { margin-top: 12px; white-space: pre-wrap; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
    }
  }
  </script>
</head>
<body>
  <h1>Compile card targets</h1>
  <p>Turns the card images into <code>targets/cards.mind</code>, the file the AR page uses to recognise cards.
     Run it again whenever you add or swap a card image. Target order follows <code>src/cards.js</code>.</p>
  <div class="cards" id="cards"></div>
  <button id="compile">Compile</button>
  <div id="status"></div>

  <script type="module">
    import { Compiler } from 'mindar-image';
    import { CARDS } from '../src/cards.js';

    const status = document.getElementById('status');
    const button = document.getElementById('compile');
    const log = (msg) => { status.textContent = msg; };

    const images = CARDS.map((card) => {
      const figure = document.createElement('figure');
      const img = new Image();
      img.src = `../${card.image}`;
      figure.append(img, card.name);
      document.getElementById('cards').append(figure);
      return new Promise((ok, fail) => {
        img.onload = () => ok(img);
        img.onerror = () => fail(new Error(`Missing image ${card.image}`));
      });
    });

    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const loaded = await Promise.all(images);
        const compiler = new Compiler();
        await compiler.compileImageTargets(loaded, (p) => log(`Compiling… ${p.toFixed(0)}%`));
        const data = compiler.exportData();

        const res = await fetch('/api/targets', { method: 'POST', body: data });
        if (!res.ok) throw new Error(`Save failed: ${await res.text()}`);
        log(`Done. ${await res.text()} to targets/cards.mind`);
        window.compileDone = true;
      } catch (err) {
        console.error(err);
        log(`Failed: ${err.message}`);
        window.compileError = err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
