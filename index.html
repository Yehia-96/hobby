<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duel AR">
  <title>Duel AR</title>
  <link rel="stylesheet" href="src/hud.css">
  <style>
    #ar { position: fixed; inset: 0; }
    #start-screen {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
      background: radial-gradient(circle at 50% 35%, #2b1d55, #0d0b1a 70%);
    }
    #start-screen h1 { margin: 0; font-size: 32px; letter-spacing: 0.5px; }
    #start-screen p { margin: 0; color: var(--muted); max-width: 340px; line-height: 1.45; }
    #start {
      min-height: 56px; padding: 0 36px; border: 0; border-radius: 14px; font-size: 18px;
      font-weight: 700; color: white; background: var(--accent);
    }
    #start-error { color: var(--bad); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="ar"></div>
  <div id="hud" hidden></div>
  <div id="start-screen">
    <h1>Duel AR</h1>
    <p>Lay Blue-Eyes White Dragon and Dark Magician on a table, tap Start, and point the camera at them.</p>
    <button id="start">Start</button>
    <p id="start-error" hidden></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
